name: Tests and portable build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.8', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Test CRC32 and Tkinter interface
        run: python -m unittest discover -s tests -v

  portable:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt
      - run: python -m pip install -r requirements-build.txt
      - name: Build single executable
        run: python -m PyInstaller --noconfirm --clean CRC32Checker.spec
      - name: Verify isolated executable
        shell: pwsh
        run: ./scripts/verify_portable.ps1
      - name: Package release assets
        shell: pwsh
        run: ./scripts/package_release.ps1 -Version (python -c "from app_metadata import VERSION; print(VERSION)")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crc32-checker-windows-x64
          path: |
            dist/CRC32Checker.exe
            dist/*-portable.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
